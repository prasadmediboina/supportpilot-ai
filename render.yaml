services:
  - type: web
    name: supportpilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: supportpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYEE_NAME
        value: SupportPilot AI
      - key: ADMIN_EMAILS
        sync: false
      - key: UPI_ID
        sync: false
      - key: SITE_URL
        sync: false
databases:
  - name: supportpilot-db
    plan: free
